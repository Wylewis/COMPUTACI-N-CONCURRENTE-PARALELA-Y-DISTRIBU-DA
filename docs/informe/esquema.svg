<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" font-family="Helvetica,Arial" font-size="11">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="20" y="22" font-size="13" font-weight="bold">Hilos</text>
<text x="20" y="162" font-size="13" font-weight="bold">Monitores (mutex y variable de condición)</text>
<text x="20" y="302" font-size="13" font-weight="bold">Compartido sin cerrojo</text>
<rect x="20" y="40" width="130" height="50" rx="6" fill="#dbe7f5" stroke="#555"/>
<text x="85.0" y="60" text-anchor="middle" font-weight="bold">hilo principal</text>
<text x="85.0" y="77" text-anchor="middle" fill="#333" font-size="10">ventana y apagado</text>
<rect x="170" y="40" width="120" height="50" rx="6" fill="#dbe7f5" stroke="#555"/>
<text x="230.0" y="60" text-anchor="middle" font-weight="bold">generador (1)</text>
<text x="230.0" y="77" text-anchor="middle" fill="#333" font-size="10">crea pedidos</text>
<rect x="310" y="40" width="150" height="50" rx="6" fill="#dbe7f5" stroke="#555"/>
<text x="385.0" y="60" text-anchor="middle" font-weight="bold">despachadores (9)</text>
<text x="385.0" y="77" text-anchor="middle" fill="#333" font-size="10">uno por restaurante</text>
<rect x="480" y="40" width="120" height="50" rx="6" fill="#dbe7f5" stroke="#555"/>
<text x="540.0" y="60" text-anchor="middle" font-weight="bold">motos (N)</text>
<text x="540.0" y="77" text-anchor="middle" fill="#333" font-size="10">un hilo por moto</text>
<rect x="620" y="40" width="120" height="50" rx="6" fill="#dbe7f5" stroke="#555"/>
<text x="680.0" y="60" text-anchor="middle" font-weight="bold">escritor del log (1)</text>
<text x="680.0" y="77" text-anchor="middle" fill="#333" font-size="10">una línea por evento</text>
<rect x="20" y="180" width="110" height="50" rx="6" fill="#fbe9cf" stroke="#555"/>
<text x="75.0" y="200" text-anchor="middle" font-weight="bold">pool de estimación</text>
<text x="75.0" y="217" text-anchor="middle" fill="#333" font-size="10">cola + N hilos</text>
<rect x="150" y="180" width="140" height="50" rx="6" fill="#fbe9cf" stroke="#555"/>
<text x="220.0" y="200" text-anchor="middle" font-weight="bold">libro de pedidos</text>
<text x="220.0" y="217" text-anchor="middle" fill="#333" font-size="10">mutex + cv por restaurante</text>
<rect x="310" y="180" width="150" height="50" rx="6" fill="#fbe9cf" stroke="#555"/>
<text x="385.0" y="200" text-anchor="middle" font-weight="bold">flota</text>
<text x="385.0" y="217" text-anchor="middle" fill="#333" font-size="10">versión + cv, rescates</text>
<rect x="480" y="180" width="120" height="50" rx="6" fill="#fbe9cf" stroke="#555"/>
<text x="540.0" y="200" text-anchor="middle" font-weight="bold">restaurantes (9)</text>
<text x="540.0" y="217" text-anchor="middle" fill="#333" font-size="10">fila + puestos</text>
<rect x="620" y="180" width="120" height="50" rx="6" fill="#fbe9cf" stroke="#555"/>
<text x="680.0" y="200" text-anchor="middle" font-weight="bold">cola de eventos</text>
<text x="680.0" y="217" text-anchor="middle" fill="#333" font-size="10">mutex + cv</text>
<rect x="20" y="320" width="440" height="50" rx="6" fill="#e4f0e0" stroke="#555"/>
<text x="240.0" y="340" text-anchor="middle" font-weight="bold">datos inmutables: grafo, tabla de distancias, config, proyección, reloj</text>
<text x="240.0" y="357" text-anchor="middle" fill="#333" font-size="10">se leen sin cerrojo desde cualquier hilo</text>
<rect x="480" y="320" width="260" height="50" rx="6" fill="#e4f0e0" stroke="#555"/>
<text x="610.0" y="340" text-anchor="middle" font-weight="bold">señal de parada: atomic + cv</text>
<text x="610.0" y="357" text-anchor="middle" fill="#333" font-size="10">la escribe el vigía de señales; la esperan todos los hilos</text>
<line x1="212" y1="90" x2="202" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
