<line x1="367" y1="90" x2="220" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="323" y="120" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">take / putBack</text>
<line x1="385" y1="90" x2="367" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="375" y="142" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">copias, assign, waitForChange</text>
<line x1="403" y1="90" x2="57" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="247" y="134" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">estimaciones</text>
<line x1="522" y1="90" x2="385" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="454" y="138" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">onFreed, rescue</text>
<line x1="540" y1="90" x2="522" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="531" y="138" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">fila y puesto</text>
<line x1="558" y1="90" x2="662" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="594" y="124" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">publish</text>
<line x1="421" y1="90" x2="680" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="602" y="156" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">publish</text>
<line x1="230" y1="90" x2="698" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="324" y="111" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">publish</text>
<line x1="662" y1="90" x2="716" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="694" y="147" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">swap de la cola</text>
<line x1="67" y1="90" x2="403" y2="180" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
<text x="319" y="160" text-anchor="middle" font-size="9" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">views (copias)</text>
</svg>